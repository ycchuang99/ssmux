name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check release versioning script
        run: python3 scripts/release-version.py self-test

      - name: Check Homebrew updater
        run: python3 scripts/update-homebrew.py --self-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package macOS menu bar app
        if: runner.os == 'macOS'
        run: scripts/package-macos-menubar.sh target/release/ssmux

  tag:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Determine release version
        id: version
        run: |
          version="$(python3 scripts/release-version.py next)"
          if [[ -z "${version}" ]]; then
            echo "No release-worthy Conventional Commits since the last tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Require release token
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "Configure RELEASE_TOKEN with write access to ssmux and homebrew-tap." >&2
            exit 1
          fi

      - name: Update package versions and push release tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-version.py set "${VERSION}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): ${VERSION}"
          fi

          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to move it." >&2
            exit 1
          fi

          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${tag}"

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package release artifact
        env:
          ARTIFACT_NAME: ssmux-${{ github.ref_name }}-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/ssmux"
          version=$("${binary}" --version | awk 'NR == 1 { print $2 }')
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${version}" != "${tag_version}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          fi

          tar -czf "${ARTIFACT_NAME}.tar.gz" \
            -C "target/${TARGET}/release" \
            ssmux
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            shasum -a 256 "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.sha256"
            scripts/package-macos-menubar.sh "${binary}"
            menubar_artifact="ssmux-menubar-${GITHUB_REF_NAME}-${TARGET}.zip"
            ditto -c -k --sequesterRsrc --keepParent \
              target/ssmux-menubar.app "${menubar_artifact}"
            shasum -a 256 "${menubar_artifact}" > "${menubar_artifact}.sha256"
          else
            sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ssmux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            ssmux-${{ github.ref_name }}-${{ matrix.target }}.sha256
          if-no-files-found: error

      - name: Upload menu bar app artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ssmux-menubar-${{ matrix.target }}
          path: |
            ssmux-menubar-${{ github.ref_name }}-${{ matrix.target }}.zip
            ssmux-menubar-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "Configure RELEASE_TOKEN with write access to ssmux and homebrew-tap." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              ssmux-*.tar.gz \
              ssmux-menubar-*.zip \
              ssmux-*.sha256
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: ycchuang99/homebrew-tap
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          path: homebrew-tap

      - name: Update Formula and Cask
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/update-homebrew.py \
            --version "${version}" \
            --assets-dir . \
            --tap-dir homebrew-tap

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ssmux.rb Casks/ssmux.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already has ssmux ${version}."
            exit 0
          fi
          git commit -m "build(release): update ssmux ${version}"
          git push origin HEAD:main

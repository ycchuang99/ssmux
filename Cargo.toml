[package]
name = "ssmux"
version = "0.1.0"
edition = "2021"
description = "A terminal manager for AWS SSM sessions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ycchuang99/ssmux"
homepage = "https://github.com/ycchuang99/ssmux"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = "0.8"
